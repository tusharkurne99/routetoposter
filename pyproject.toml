[project]
name = "routetoposter"
version = "0.2.0"
description = "Turn a Google Maps road trip into a maptoposter-style map poster"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pyyaml>=6", "shapely>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
routetoposter = "routetoposter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["routetoposter"]
